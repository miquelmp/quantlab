# Metadatos de la web para cada capítulo del libro (español).
# El texto de los capítulos NO está aquí: sale siempre de libro.md (fuente única).
# - slug: parte final de la URL. No cambiarlo una vez publicado (rompe enlaces).
# - publicado: true si el capítulo ya está en la web; false = «próximamente».
# - descripcion: resumen para buscadores y redes sociales (máx. ~160 caracteres).
# - requisitos: capítulos que conviene leer antes.

