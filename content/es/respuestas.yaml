# Respuestas numéricas de los ejercicios de cálculo (comprobación automática).
# Se extraen de las «Soluciones de los ejercicios» del libro; el libro no se toca (supuesto D-03).
#
# Cada ejercicio tiene una o varias partes:
#   etiqueta:   lo que se pide, tal como lo verá el lector junto al campo.
#   valor:      la respuesta, en tanto por uno si tipo = porcentaje (−12 % → -0.12).
#   tipo:       porcentaje | numero
#   tolerancia: margen admitido, en las mismas unidades que «valor».
#               Si se omite: 0,0005 para porcentajes y 0,5 % relativo para números.

